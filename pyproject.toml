[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Project openT2L: distribution name `opent2l`, import name `t2l`.
name = "opent2l"
dynamic = ["version"]
authors = [{ name = "ASH1998" }]
description = "A hypernetwork that reads a few examples of a new task and emits a LoRA adapter for a frozen model in one forward pass."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["lora", "hypernetwork", "peft", "few-shot", "text-to-lora"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "numpy",  # safetensors.torch needs it at save/load time but does not declare it
]

[project.optional-dependencies]
hf = ["transformers>=4.45", "peft>=0.13", "accelerate"]
dev = ["pytest>=8", "ruff", "build"]

[project.urls]
Source = "https://github.com/ASH1998/openT2L"

[tool.setuptools.dynamic]
version = { attr = "t2l.__version__" }

[tool.setuptools.packages.find]
include = ["t2l*"]

[tool.setuptools.package-data]
t2l = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
